<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(1050px,92%);margin:auto;padding:45px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:35px;background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:25px}.mainimg{width:100%;height:430px;object-fit:contain;background:#f2f6fa;border-radius:14px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:75px;height:65px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#078cff}.cat{color:#078cff;font-weight:700}.price{font-size:2rem;font-weight:800;color:#17324f;margin:18px 0}.old{text-decoration:line-through;color:#8998a8;font-size:1rem;margin-right:8px}.button{display:inline-block;text-decoration:none;margin-top:10px}.back{display:inline-block;margin-bottom:20px}@media(max-width:750px){.detail{grid-template-columns:1fr}.mainimg{height:330px}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a><a href="index.html#contato">Contato</a></nav></div></header><main class="wrap"><a class="back" href="produtos.html">← Voltar para Produtos e Serviços</a><div id="content">Carregando...</div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){if(!id){$('#content').textContent='Produto não encontrado.';return}const{data:p,error}=await sb.from('products').select('*').eq('id',id).eq('active',true).single();if(error||!p){$('#content').textContent='Produto não encontrado ou indisponível.';return}const{data:imgs}=await sb.from('product_images').select('*').eq('product_id',p.id).order('is_cover',{ascending:false}).order('sort_order');const list=imgs||[],cover=list[0]?.public_url||'';const price=Number(p.promotional_price??p.price??0),old=p.promotional_price&&Number(p.price)>price?`<span class="old">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:'';$('#content').innerHTML=`<section class="detail"><div><img id="mainimg" class="mainimg" src="${esc(cover)}" alt="${esc(p.name)}">${list.length>1?`<div class="thumbs">${list.map((i,n)=>`<img class="${n===0?'active':''}" src="${esc(i.public_url)}" data-src="${esc(i.public_url)}" alt="Foto ${n+1}">`).join('')}</div>`:''}</div><div><span class="cat">${esc(p.category||'Produto')}</span><h1>${esc(p.name)}</h1>${p.brand?`<p><strong>Marca:</strong> ${esc(p.brand)}</p>`:''}<p>${esc(p.description||'')}</p>${p.specifications?`<h3>Especificações</h3><p>${esc(p.specifications).replace(/\n/g,'<br>')}</p>`:''}${p.warranty?`<p><strong>Garantia:</strong> ${esc(p.warranty)}</p>`:''}<div class="price">${old}R$ ${price.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><a class="button" target="_blank" href="https://wa.me/5511977066221?text=${encodeURIComponent('Olá! Tenho interesse em '+p.name+' no valor de R$ '+price.toLocaleString('pt-BR',{minimumFractionDigits:2})+'.')}">Solicitar pelo WhatsApp</a></div></section>`;document.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{document.querySelector('#mainimg').src=t.dataset.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('active'));t.classList.add('active')})}load();</script></body></html>
