<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(1050px,92%);margin:auto;padding:45px 0}.detail{display:grid;grid-template-columns:1fr 1fr;gap:35px;background:#fff;border:1px solid #dbe5ef;border-radius:18px;padding:25px}.mainimg{width:100%;height:430px;object-fit:contain;background:#f2f6fa;border-radius:14px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:75px;height:65px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#078cff}.cat{color:#078cff;font-weight:700}.price{font-size:2rem;font-weight:800;color:#17324f;margin:18px 0}.old{text-decoration:line-through;color:#8998a8;font-size:1rem;margin-right:8px}.button{display:inline-block;text-decoration:none;margin:6px 8px 6px 0;padding:12px 18px;border-radius:9px;background:#078cff;color:#fff;font-weight:700;border:0;cursor:pointer}.cart{background:#17324f}.back{display:inline-block;margin-bottom:20px}.error{padding:18px;border:1px solid #f0caca;border-radius:12px;background:#fff5f5;color:#8a2222}@media(max-width:750px){.detail{grid-template-columns:1fr}.mainimg{height:330px}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a><a href="index.html#contato">Contato</a><a href="carrinho.html">🛒 Carrinho</a></nav></div></header><main class="wrap"><a class="back" href="produtos.html">← Voltar para Produtos e Serviços</a><div id="content">Carregando...</div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script>const API='https://sjmalhhugkixboenycex.supabase.co/rest/v1';const KEY='sb_publishable_oXjtaNLw5daX7aaPR4H-9R8Rtg';const headers={apikey:KEY,Authorization:'Bearer '+KEY};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const id=new URLSearchParams(location.search).get('id');async function api(path){const r=await fetch(API+path,{headers});const text=await r.text();if(!r.ok)throw new Error(text||('HTTP '+r.status));return text?JSON.parse(text):null}async function load(){try{if(!id)throw new Error('Produto não encontrado: o endereço não contém o ID.');const ps=await api('/products?select=*&id=eq.'+encodeURIComponent(id)+'&active=eq.true&limit=1');const p=ps&&ps[0];if(!p)throw new Error('Produto não encontrado ou indisponível.');const imgs=await api('/product_images?select=id,public_url,is_cover,sort_order&product_id=eq.'+encodeURIComponent(p.id)+'&order=is_cover.desc,sort_order.asc');const list=imgs||[],cover=list[0]?.public_url||'';const price=Number(p.promotional_price??p.price??0),old=p.promotional_price&&Number(p.price)>price?`<span class="old">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:'';const wa='https://wa.me/5511977066221?text='+encodeURIComponent('Olá! Tenho interesse em '+p.name+' no valor de R$ '+price.toLocaleString('pt-BR',{minimumFractionDigits:2})+'.');$('content').innerHTML=`<section class="detail"><div>${cover?`<img id="mainimg" class="mainimg" src="${esc(cover)}" alt="${esc(p.name)}">`:'<div class="mainimg" style="display:grid;place-items:center">Sem foto cadastrada</div>'}${list.length?`<div class="thumbs">${list.map((i,n)=>`<img class="${n===0?'active':''}" src="${esc(i.public_url)}" data-src="${esc(i.public_url)}" alt="Foto ${n+1}" loading="lazy">`).join('')}</div>`:''}</div><div><span class="cat">${esc(p.category||'Produto')}</span><h1>${esc(p.name)}</h1>${p.brand?`<p><strong>Marca:</strong> ${esc(p.brand)}</p>`:''}<p>${esc(p.description||'').replace(/\n/g,'<br>')}</p>${p.specifications?`<h3>Especificações</h3><p>${esc(p.specifications).replace(/\n/g,'<br>')}</p>`:''}${p.warranty?`<p><strong>Garantia:</strong> ${esc(p.warranty)}</p>`:''}<div class="price">${old}R$ ${price.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><button class="button cart" id="add">Adicionar ao carrinho</button><a class="button" target="_blank" rel="noopener" href="${wa}">Solicitar pelo WhatsApp</a><p id="ok"></p></div></section>`;document.querySelectorAll('.thumbs img').forEach(t=>t.addEventListener('click',()=>{$('mainimg').src=t.dataset.src;document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('active'));t.classList.add('active')}));$('add').onclick=()=>{const cart=JSON.parse(localStorage.getItem('araujo_cart')||'[]');const existing=cart.find(x=>x.id===p.id);if(existing)existing.quantity++;else cart.push({id:p.id,name:p.name,price,cover,quantity:1});localStorage.setItem('araujo_cart',JSON.stringify(cart));$('ok').textContent='Produto adicionado ao carrinho.'}}catch(e){$('content').innerHTML=`<div class="error"><strong>Não foi possível carregar o anúncio.</strong><br><small>${esc(e.message)}</small><br><br><a href="produtos.html">Voltar aos produtos</a></div>`}}load();</script></body></html>
