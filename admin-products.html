<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | Painel Araújo</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#102033}.wrap{max-width:1100px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:white;border:1px solid #dbe5ef;border-radius:16px;padding:22px;margin-top:20px}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd8e4;border-radius:9px;box-sizing:border-box}button{background:#087df5;color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.muted{color:#687c91}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:12px}.photo{border:1px solid #dbe5ef;border-radius:10px;padding:8px}.photo img{width:100%;height:110px;object-fit:cover;border-radius:7px}.small{font-size:12px;color:#687c91}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>🛒 Produtos</h1><div class="muted">Cadastro e gerenciamento do catálogo</div></div><a href="admin-dashboard.html">← Painel</a></div><div class="card"><h2>Novo produto</h2><div class="row"><div><label>Nome</label><input id="name"><label>Categoria</label><input id="category" value="Produtos"><label>Marca</label><input id="brand"></div><div><label>Preço</label><input id="price" type="number" step="0.01"><label>Preço promocional</label><input id="promo" type="number" step="0.01"><label>Estoque</label><input id="stock" type="number" value="0"></div></div><label>Descrição</label><textarea id="description" rows="5"></textarea><label>Especificações</label><textarea id="specifications" rows="4"></textarea><div class="row"><div><label>Garantia</label><input id="warranty"></div><div><label>Vídeo (URL)</label><input id="video"></div></div><label>Fotos do produto</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="preview" class="photos"></div><p class="small">JPG, PNG ou WebP. Até 5 MB por foto.</p><label><input id="featured" type="checkbox" style="width:auto"> Produto em destaque</label><br><label><input id="active" type="checkbox" checked style="width:auto"> Produto ativo</label><br><br><button onclick="save()">Cadastrar produto</button><p id="msg"></p></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=id=>document.getElementById(id);const files=[];$('photos').addEventListener('change',e=>{files.length=0;files.push(...e.target.files);$('preview').innerHTML='';files.forEach(f=>{const r=new FileReader();r.onload=()=>{$('preview').insertAdjacentHTML('beforeend',`<div class="photo"><img src="${r.result}"><div class="small">${f.name}</div></div>`)};r.readAsDataURL(f)})});async function save(){const{data:{user}}=await sb.auth.getUser();if(!user){location.href='admin.html';return}const name=$('name').value.trim();if(!name){$('msg').textContent='Informe o nome do produto.';return}$('msg').textContent='Salvando...';const slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now();const{data:p,error}=await sb.from('products').insert({name,slug,category:$('category').value,brand:$('brand').value,price:Number($('price').value||0),promotional_price:$('promo').value?Number($('promo').value):null,stock:Number($('stock').value||0),description:$('description').value,specifications:$('specifications').value,warranty:$('warranty').value,video_url:$('video').value,featured:$('featured').checked,active:$('active').checked,created_by:user.id}).select('id').single();if(error){$('msg').textContent=error.message;return}let uploaded=0;for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5242880){$('msg').textContent=`A foto ${f.name} ultrapassa 5 MB.`;continue}const ext=f.name.split('.').pop().toLowerCase();const path=`${p.id}/${crypto.randomUUID()}.${ext}`;const{error:up}=await sb.storage.from('product-images').upload(path,f,{contentType:f.type,upsert:false});if(up){$('msg').textContent=`Produto criado, mas houve erro no upload: ${up.message}`;continue}const{data:u}=sb.storage.from('product-images').getPublicUrl(path);const{error:ie}=await sb.from('product_images').insert({product_id:p.id,storage_path:path,public_url:u.publicUrl,sort_order:i,is_cover:i===0});if(!ie)uploaded++}$('msg').textContent=`Produto cadastrado com sucesso! ${uploaded} foto(s) enviada(s).`;document.querySelectorAll('input,textarea').forEach(e=>{if(e.type==='checkbox')e.checked=e.id==='active';else if(e.id!=='category'&&e.id!=='photos')e.value=''});$('preview').innerHTML='';files.length=0}</script></body></html>
