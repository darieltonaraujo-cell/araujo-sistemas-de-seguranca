<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedido | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(800px,92%);margin:auto;padding:70px 0}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:30px}.status{font-size:1.3rem;font-weight:700}.btn{display:inline-block;margin-top:20px;background:#078cff;color:#fff;padding:12px 18px;border-radius:9px;text-decoration:none}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a></nav></div></header><main class="wrap"><div class="card"><h1>Pedido recebido</h1><p id="status">Consultando o pedido...</p><a class="btn" href="produtos.html">Voltar para Produtos</a></div></main><script>const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('status').textContent='Pedido não informado.'}else{fetch('https://sjmalhhugkixboenycex.supabase.co/functions/v1/order-status?id='+encodeURIComponent(id)).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||'Pedido não encontrado');document.getElementById('status').textContent=`Pedido ${d.id} — status: ${d.status} — total: R$ ${Number(d.total).toLocaleString('pt-BR',{minimumFractionDigits:2})}`}).catch(()=>document.getElementById('status').textContent='Não foi possível consultar o pedido agora.')}localStorage.removeItem('araujo_cart');</script></body></html>
