<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f4f7fa}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button,.btn{border:1px solid #cbd8e5;background:#fff;color:#17324f;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary,.nav button.active{background:#078cff;color:#fff;border-color:#078cff}.btn.danger{color:#b42318;border-color:#e0b4b0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:20px}.stat strong{display:block;font-size:1.8rem;color:#078cff}.muted{color:#60758a}.panel{background:#fff;border:1px solid #d9e3ed;border-radius:16px;padding:22px;margin-bottom:18px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quick .btn{text-align:left;min-height:75px}.status-list{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:20px;background:#eef4f8;font-weight:700}.msg{font-weight:700;margin-top:10px}@media(max-width:800px){.stats,.quick{grid-template-columns:1fr 1fr}}@media(max-width:550px){.stats,.quick{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><small>ÁREA ADMINISTRATIVA</small><h1>Dashboard</h1><p class="muted">Araújo Sistemas de Segurança</p></div><button class="btn danger" id="logout">Sair</button></div><div class="nav"><button class="active">🏠 Dashboard</button><button onclick="location.href='admin-projects.html'">🏗️ Projetos</button><button onclick="location.href='products-admin.html'">🛒 Produtos</button><button onclick="location.href='admin-orders.html'">📦 Pedidos</button><button onclick="location.href='payments.html'">💳 Pagamentos</button><button onclick="location.href='index.html'">🌐 Ver site</button></div><section class="stats"><div class="stat"><strong id="products">0</strong>Produtos ativos</div><div class="stat"><strong id="projects">0</strong>Projetos publicados</div><div class="stat"><strong id="pending">0</strong>Pedidos pendentes</div><div class="stat"><strong id="revenue">R$ 0,00</strong>Vendas pagas</div></section><section class="panel"><h2>Atalhos</h2><div class="quick"><button class="btn" onclick="location.href='products-admin.html'">🛒 <b>Gerenciar produtos</b><br><small>Preço, estoque e fotos</small></button><button class="btn" onclick="location.href='admin-projects.html'">🏗️ <b>Gerenciar projetos</b><br><small>Fotos, capa e publicação</small></button><button class="btn" onclick="location.href='admin-orders.html'">📦 <b>Gerenciar pedidos</b><br><small>Clientes, frete e status</small></button><button class="btn" onclick="location.href='payments.html'">💳 <b>Meios de pagamento</b><br><small>Pix e cartões</small></button><button class="btn" onclick="location.href='index.html'">🌐 <b>Abrir loja</b><br><small>Visualizar como cliente</small></button><button class="btn" id="reset">🔐 <b>Alterar senha</b><br><small>Enviar recuperação por e-mail</small></button></div><div id="msg" class="msg"></div></section><section class="panel"><h2>Status dos pedidos</h2><div class="status-list"><span class="chip">Pendentes: <b id="sPending">0</b></span><span class="chip">Pagos: <b id="sPaid">0</b></span><span class="chip">Em preparação: <b id="sProcessing">0</b></span><span class="chip">Enviados: <b id="sShipped">0</b></span><span class="chip">Entregues: <b id="sCompleted">0</b></span><span class="chip">Cancelados: <b id="sCancelled">0</b></span></div></section><section class="panel"><h2>Últimos pedidos</h2><div id="recent" class="muted">Carregando...</div></section></main><script>const sb=supabase.createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='admin.html';return}const[p,pr,o]=await Promise.all([sb.from('products').select('id,active',{count:'exact'}),sb.from('projects').select('id,published',{count:'exact'}),sb.from('orders').select('id,customer_name,total,status,created_at').order('created_at',{ascending:false})]);if(p.error||pr.error||o.error){$('msg').textContent=p.error?.message||pr.error?.message||o.error?.message;return}const products=p.data||[],projects=pr.data||[],orders=o.data||[];$('products').textContent=products.filter(x=>x.active).length;$('projects').textContent=projects.filter(x=>x.published).length;const count=s=>orders.filter(x=>x.status===s).length;$('pending').textContent=count('pending');$('sPending').textContent=count('pending');$('sPaid').textContent=count('paid');$('sProcessing').textContent=count('processing');$('sShipped').textContent=count('shipped');$('sCompleted').textContent=count('completed');$('sCancelled').textContent=count('cancelled');$('revenue').textContent=money(orders.filter(x=>x.status==='paid'||x.status==='processing'||x.status==='shipped'||x.status==='completed').reduce((n,x)=>n+Number(x.total||0),0));$('recent').innerHTML=orders.slice(0,8).length?'<div>'+orders.slice(0,8).map(x=>`<div style="padding:10px 0;border-bottom:1px solid #e6edf3"><b>${esc(x.customer_name)}</b> — ${money(x.total)} — ${esc(x.status)}<br><small>${new Date(x.created_at).toLocaleString('pt-BR')}</small></div>`).join('')+'</div>':'Nenhum pedido.'}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};$('reset').onclick=async()=>{const r=await sb.auth.resetPasswordForEmail('darieltonaraujo@gmail.com',{redirectTo:location.href});$('msg').textContent=r.error?r.error.message:'E-mail de recuperação enviado.'};load();</script></body></html>
