<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f4f7fa}.wrap{width:min(1150px,94%);margin:auto;padding:35px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.top h1{margin:0}.panel{background:#fff;border:1px solid #d9e3ed;border-radius:16px;padding:24px;margin-bottom:20px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button,.btn{border:1px solid #cbd8e5;background:#fff;color:#17324f;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.nav button.active,.btn.primary{background:#078cff;color:#fff;border-color:#078cff}.btn.danger{color:#b42318;border-color:#e0b4b0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:20px}.stat strong{display:block;font-size:2rem;color:#078cff}.muted{color:#60758a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:16px}.field{display:grid;gap:6px;margin:14px 0}.field input,.field textarea{padding:12px;border:1px solid #cbd8e5;border-radius:8px;font:inherit}.field textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#e9f7ef;color:#14733d;font-size:.8rem;font-weight:700}.badge.off{background:#f1f3f5;color:#65717d}.msg{font-weight:700;margin-top:10px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><small>ÁREA ADMINISTRATIVA</small><h1>Dashboard</h1><p class="muted">Araújo Sistemas de Segurança</p></div><button class="btn danger" id="logout">Sair</button></div><div class="nav"><button class="active" data-tab="dash">🏠 Dashboard</button><button data-tab="projects">📁 Projetos</button><button data-tab="new">➕ Novo projeto</button><button data-tab="admins">👥 Administradores</button><button data-tab="settings">⚙️ Configurações</button></div><section id="dash" class="tab"><div class="stats"><div class="stat"><strong id="total">0</strong>Projetos</div><div class="stat"><strong id="published">0</strong>Publicados</div><div class="stat"><strong id="photosCount">0</strong>Fotos</div></div></section><section id="projects" class="tab" style="display:none"><div class="panel"><h2>Projetos</h2><div id="grid" class="grid"></div></div></section><section id="new" class="tab" style="display:none"><div class="panel"><h2 id="formTitle">Novo projeto</h2><form id="form"><input id="editId" type="hidden"><div class="field"><label>Título</label><input id="title" required></div><div class="field"><label>Descrição</label><textarea id="description" required></textarea></div><div class="field"><label>Fotos</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><small class="muted">Máximo 5 MB por foto.</small></div><button class="btn primary" type="submit">Salvar projeto</button><button class="btn" type="button" id="cancel">Cancelar</button><div id="formMsg" class="msg"></div></form></div></section><section id="admins" class="tab" style="display:none"><div class="panel"><h2>Administradores</h2><div id="adminList"></div></div></section><section id="settings" class="tab" style="display:none"><div class="panel"><h2>Configurações</h2><p class="muted">Altere sua senha pelo e-mail de recuperação.</p><button class="btn primary" id="reset">Enviar e-mail para alterar senha</button><div id="setMsg" class="msg"></div></div></section></main><script>const sb=supabase.createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=x=>document.getElementById(x);let projects=[];function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function url(p){return sb.storage.from('projetos').getPublicUrl(p).data.publicUrl}async function load(){const r=await sb.from('projects').select('*,project_photos(*)').order('created_at',{ascending:false});if(r.error){$('grid').innerHTML='<p>Erro ao carregar projetos: '+esc(r.error.message)+'</p>';return}projects=r.data||[];$('total').textContent=projects.length;$('published').textContent=projects.filter(p=>p.published).length;$('photosCount').textContent=projects.reduce((n,p)=>n+(p.project_photos?.length||1),0);$('grid').innerHTML=projects.length?projects.map(p=>`<article class="card"><img src="${url(p.image_path)}"><div class="card-body"><span class="badge ${p.published?'':'off'}">${p.published?'Publicado':'Oculto'}</span><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description)}</p><div class="actions"><button class="btn primary" onclick="edit('${p.id}')">Editar</button><button class="btn" onclick="toggle('${p.id}')">${p.published?'Ocultar':'Publicar'}</button><button class="btn danger" onclick="removeProject('${p.id}')">Excluir</button></div></div></article>`).join(''):'<p>Nenhum projeto cadastrado.</p>'}async function toggle(id){const p=projects.find(x=>x.id===id);await sb.from('projects').update({published:!p.published}).eq('id',id);load()}async function removeProject(id){if(!confirm('Excluir este projeto e suas fotos?'))return;const p=projects.find(x=>x.id===id);const paths=[p.image_path,...(p.project_photos||[]).map(x=>x.image_path)].filter(Boolean);await sb.storage.from('projetos').remove(paths);await sb.from('projects').delete().eq('id',id);load()}function edit(id){const p=projects.find(x=>x.id===id);$('editId').value=id;$('title').value=p.title;$('description').value=p.description;$('formTitle').textContent='Editar projeto';show('new')}function show(id){document.querySelectorAll('.tab').forEach(x=>x.style.display='none');$(id).style.display='block';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='projects'||id==='dash')load();if(id==='admins')admins()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));$('cancel').onclick=()=>show('projects');$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};$('form').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await sb.auth.getUser();const id=$('editId').value,files=[...$('photos').files];if(files.some(f=>f.size>5*1024*1024))return $('formMsg').textContent='Cada foto deve ter no máximo 5 MB.';let project;if(id){const r=await sb.from('projects').update({title:$('title').value.trim(),description:$('description').value.trim()}).eq('id',id);if(r.error)return $('formMsg').textContent=r.error.message;project={id}}else{if(!files.length)return $('formMsg').textContent='Selecione pelo menos uma foto.';const f=files[0],path=crypto.randomUUID()+'.'+f.name.split('.').pop().toLowerCase();const up=await sb.storage.from('projetos').upload(path,f,{contentType:f.type});if(up.error)return $('formMsg').textContent=up.error.message;const r=await sb.from('projects').insert({title:$('title').value.trim(),description:$('description').value.trim(),image_path:path,created_by:user.id,published:true}).select().single();if(r.error)return $('formMsg').textContent=r.error.message;project=r.data;await sb.from('project_photos').insert({project_id:project.id,image_path:path,sort_order:0})}for(let i=id?0:1;i<files.length;i++){const f=files[i],path=crypto.randomUUID()+'.'+f.name.split('.').pop().toLowerCase(),up=await sb.storage.from('projetos').upload(path,f,{contentType:f.type});if(!up.error)await sb.from('project_photos').insert({project_id:project.id,image_path:path,sort_order:i})}$('formMsg').textContent='Projeto salvo!';$('form').reset();$('editId').value='';load();show('projects')};async function admins(){const r=await sb.from('admin_profiles').select('*').order('created_at');$('adminList').innerHTML=(r.data||[]).map(a=>`<div class="panel"><b>${esc(a.display_name)}</b><br><span class="muted">${esc(a.role)} • ${a.active?'Ativo':'Inativo'}</span></div>`).join('')||'<p>Nenhum administrador cadastrado.</p>'}$('reset').onclick=async()=>{const r=await sb.auth.resetPasswordForEmail('darieltonaraujo@gmail.com',{redirectTo:location.href});$('setMsg').textContent=r.error?r.error.message:'E-mail enviado.'};(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='admin.html';return}load()})();</script></body></html>
