<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos e Serviços | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.shop{width:min(1120px,92%);margin:auto;padding:50px 0}.shop h1{color:#17324f}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #cbd8e5;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid #d9e3ed;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 25px #1020330d}.card img{width:100%;height:230px;object-fit:cover;background:#edf3f8}.body{padding:18px}.cat{font-size:.82rem;font-weight:700;color:#078cff}.body h2{font-size:1.2rem;color:#17324f;margin:7px 0}.desc{color:#60758a;min-height:48px}.price{font-size:1.5rem;font-weight:800;color:#17324f;margin:14px 0}.buy{display:inline-block;text-decoration:none}.empty{padding:40px;text-align:center;color:#60758a;grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="index.html#servicos">Serviços</a><a href="projetos.html">Projetos</a><a href="produtos.html">Produtos e Serviços</a><a href="index.html#contato">Contato</a></nav></div></header><main class="shop"><small>CATÁLOGO</small><h1>Produtos e Serviços</h1><p>Confira nossos produtos e serviços de segurança eletrônica.</p><div class="toolbar"><input id="search" placeholder="Buscar produto ou serviço..."><select id="category"><option value="">Todas as categorias</option></select></div><div id="grid" class="grid"><div class="empty">Carregando...</div></div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script>
const client=supabase.createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const url=p=>client.storage.from('projetos').getPublicUrl(p).data.publicUrl;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let products=[];function render(){const q=document.querySelector('#search').value.toLowerCase().trim(),cat=document.querySelector('#category').value;const list=products.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+' '+p.description).toLowerCase().includes(q)));document.querySelector('#grid').innerHTML=list.length?list.map(p=>`<article class="card"><img src="${url(p.image_path)}" alt="${esc(p.name)}" loading="lazy"><div class="body"><span class="cat">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p class="desc">${esc(p.description)}</p><div class="price">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><a class="button buy" target="_blank" href="https://wa.me/5511977066221?text=${encodeURIComponent('Olá! Tenho interesse em '+p.name+' no valor de R$ '+Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})+'.')}">Solicitar pelo WhatsApp</a></div></article>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>'}async function load(){const {data,error}=await client.from('products').select('*').eq('active',true).order('featured',{ascending:false}).order('created_at',{ascending:false});if(error){document.querySelector('#grid').innerHTML='<div class="empty">Não foi possível carregar o catálogo.</div>';return}products=data||[];[...new Set(products.map(p=>p.category))].forEach(c=>document.querySelector('#category').insertAdjacentHTML('beforeend',`<option>${esc(c)}</option>`));render()}document.querySelector('#search').oninput=render;document.querySelector('#category').onchange=render;load();
</script></body></html>
