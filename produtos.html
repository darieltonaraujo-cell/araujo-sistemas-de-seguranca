<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos e Serviços | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.shop{width:min(1120px,92%);margin:auto;padding:50px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #cbd8e5;border-radius:9px;font:inherit}.toolbar input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.product-card{border:1px solid #d9e3ed;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 8px 25px #1020330d;cursor:pointer;transition:.2s}.product-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #1020331a}.product-card .cover{height:230px;background:#edf3f8;position:relative}.product-card .cover img{width:100%;height:100%;object-fit:cover}.product-card .badge{position:absolute;top:12px;left:12px;background:#078cff;color:#fff;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700}.product-card .body{padding:18px}.cat{font-size:.82rem;font-weight:700;color:#078cff}.product-card h2{font-size:1.2rem;color:#17324f;margin:7px 0}.desc{color:#60758a;min-height:48px}.price{font-size:1.5rem;font-weight:800;color:#17324f;margin:14px 0}.old{font-size:.9rem;color:#8494a4;text-decoration:line-through;margin-right:7px}.hint{font-size:.8rem;color:#60758a}.empty{padding:40px;text-align:center;color:#60758a;grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="index.html#servicos">Serviços</a><a href="projetos.html">Projetos</a><a href="produtos.html">Produtos e Serviços</a><a href="index.html#contato">Contato</a></nav></div></header><main class="shop"><small>CATÁLOGO</small><h1>Produtos e Serviços</h1><p>Confira nossos produtos e serviços de segurança eletrônica.</p><div class="toolbar"><input id="search" placeholder="Buscar produto ou serviço..."><select id="category"><option value="">Todas as categorias</option></select></div><div id="grid" class="grid"><div class="empty">Carregando...</div></div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const client=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let products=[],images=[];function render(){const q=document.querySelector('#search').value.toLowerCase().trim(),cat=document.querySelector('#category').value,list=products.filter(p=>(!cat||p.category===cat)&&(!q||(p.name+' '+(p.description||'')+' '+(p.brand||'')).toLowerCase().includes(q)));document.querySelector('#grid').innerHTML=list.length?list.map(p=>{const ims=images.filter(i=>i.product_id===p.id).sort((a,b)=>Number(b.is_cover)-Number(a.is_cover)||a.sort_order-b.sort_order),cover=ims[0]?.public_url||'',price=Number(p.promotional_price??p.price??0),old=p.promotional_price&&Number(p.price)>price?`<span class="old">R$ ${Number(p.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`:'';return `<article class="product-card" data-id="${p.id}" tabindex="0"><div class="cover">${cover?`<img src="${esc(cover)}" alt="${esc(p.name)}" loading="lazy">`:'<span>Sem foto</span>'}${p.featured?'<span class="badge">DESTAQUE</span>':''}</div><div class="body"><span class="cat">${esc(p.category||'Produto')}</span><h2>${esc(p.name)}</h2><p class="desc">${esc((p.description||'').slice(0,110))}${(p.description||'').length>110?'…':''}</p><div class="price">${old}R$ ${price.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="hint">Clique no anúncio para ver detalhes</div></div></article>`}).join(''):'<div class="empty">Nenhum produto encontrado.</div>';document.querySelectorAll('.product-card').forEach(c=>{const go=()=>location.href='produto.html?id='+encodeURIComponent(c.dataset.id);c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')go()}})}async function load(){const{data,error}=await client.from('products').select('*').eq('active',true).order('featured',{ascending:false}).order('created_at',{ascending:false});if(error){document.querySelector('#grid').innerHTML='<div class="empty">Não foi possível carregar o catálogo.</div>';return}products=data||[];const{data:im}=await client.from('product_images').select('product_id,public_url,is_cover,sort_order').order('sort_order');images=im||[];[...new Set(products.map(p=>p.category).filter(Boolean))].sort().forEach(c=>document.querySelector('#category').insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)}</option>`));render()}document.querySelector('#search').oninput=render;document.querySelector('#category').onchange=render;load();</script></body></html>
