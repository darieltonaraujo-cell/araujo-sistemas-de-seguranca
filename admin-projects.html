<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projetos | Painel</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#102033}.wrap{max-width:1100px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:20px;margin:16px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd8e4;border-radius:9px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin:3px}.primary{background:#087df5;color:#fff}.danger{background:#c62828;color:#fff}.ghost{background:#eaf1f7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.photo{border:1px solid #dbe5ef;border-radius:10px;padding:7px}.photo img{width:100%;height:100px;object-fit:cover;border-radius:7px}.msg{padding:10px;border-radius:8px;background:#eef6ff;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>🏗️ Gerenciar Projetos</h1><p><a href="admin-dashboard.html">← Voltar ao painel</a></p><div class="card"><h2>Novo projeto</h2><div class="grid"><div><label>Título</label><input id="title"><label>Categoria</label><input id="category" value="CFTV"><label>Local</label><input id="location"><label>Data do serviço</label><input id="date" type="date"></div><div><label>Descrição</label><textarea id="description" rows="6"></textarea><label>Detalhes</label><textarea id="details" rows="4"></textarea></div></div><label>Detalhes técnicos</label><textarea id="technical" rows="4"></textarea><label>Fotos (várias)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="preview" class="photos"></div><label><input id="published" type="checkbox" checked> Publicado</label> <label><input id="featured" type="checkbox"> Destaque</label><br><button class="primary" id="save">Cadastrar projeto</button><div id="msg"></div></div><div class="card"><h2>Projetos cadastrados</h2><div id="list">Carregando...</div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=id=>document.getElementById(id);let files=[];$('photos').onchange=e=>{files=[...e.target.files];$('preview').innerHTML=files.map((f,i)=>`<div class="photo"><img id="p${i}"><small>${f.name}</small><br><label><input type="radio" name="cover" value="${i}" ${i===0?'checked':''}> Capa</label></div>`).join('');files.forEach((f,i)=>{const r=new FileReader();r.onload=()=>document.getElementById('p'+i).src=r.result;r.readAsDataURL(f)})};async function session(){const{data:{user}}=await sb.auth.getUser();if(!user){location.href='admin.html';throw new Error('Faça login no painel.')}return user}async function load(){try{await session();const{data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false});if(error)throw error;$('list').innerHTML=data.length?data.map(p=>`<div class="card"><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><small>${esc(p.category||'')} ${p.location?'• '+esc(p.location):''}</small><br><button class="ghost" onclick="togglePub('${p.id}',${!p.published})">${p.published?'Ocultar':'Publicar'}</button><button class="danger" onclick="delProj('${p.id}')">Excluir</button></div>`).join(''):'Nenhum projeto cadastrado.'}catch(e){$('list').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.togglePub=async(id,v)=>{const{error}=await sb.from('projects').update({published:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()};window.delProj=async id=>{if(!confirm('Excluir este projeto e suas fotos?'))return;await sb.from('project_photos').delete().eq('project_id',id);const{error}=await sb.from('projects').delete().eq('id',id);if(error)alert(error.message);else load()};$('save').onclick=async()=>{try{const user=await session();const title=$('title').value.trim();if(!title)throw new Error('Informe o título.');$('save').disabled=true;$('msg').textContent='Salvando...';const slug=title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now();const{data:p,error}=await sb.from('projects').insert({title,slug,description:$('description').value,category:$('category').value,location:$('location').value,service_date:$('date').value||null,details:$('details').value,technical_details:$('technical').value,published:$('published').checked,featured:$('featured').checked,created_by:user.id}).select('id').single();if(error)throw error;const cover=Number(document.querySelector('input[name=cover]:checked')?.value||0);for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5242880)continue;const ext=f.name.split('.').pop().toLowerCase(),path=`${p.id}/${crypto.randomUUID()}.${ext}`;const{error:up}=await sb.storage.from('projetos').upload(path,f,{contentType:f.type});if(up)continue;const{data:u}=sb.storage.from('projetos').getPublicUrl(path);await sb.from('project_photos').insert({project_id:p.id,image_path:path,public_url:u.publicUrl,sort_order:i,is_cover:i===cover})}$('msg').textContent=`Projeto cadastrado com ${files.length} foto(s).`;$('title').value='';$('description').value='';$('details').value='';$('technical').value='';$('location').value='';$('date').value='';$('photos').value='';$('preview').innerHTML='';files=[];load()}catch(e){$('msg').textContent='Erro: '+e.message}finally{$('save').disabled=false}};load()</script></body></html>
