<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(900px,92%);margin:auto;padding:45px 0}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:24px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8e4;border-radius:9px;margin:6px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.total{font-size:1.5rem;font-weight:800;text-align:right}.btn{background:#078cff;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:15px}.ok{background:#edf9f1;padding:15px;border-radius:10px}.err{background:#fff1f1;color:#9a2222;padding:15px;border-radius:10px}.details{margin-top:10px;background:#fff;border:1px solid #f0caca;border-radius:8px;padding:10px;white-space:pre-wrap;font-size:13px;overflow:auto}.shipping-option{display:block;border:1px solid #dbe5ef;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.shipping-option:hover{background:#f7fbff}.muted{color:#64748b;font-size:.92rem}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a><a href="carrinho.html">🛒 Carrinho</a></nav></div></header><main class="wrap"><h1>Finalizar compra</h1><div class="card"><h2>Seus dados</h2><div class="grid"><div><label>Nome completo</label><input id="name" required></div><div><label>E-mail</label><input id="email" type="email" required></div><div><label>WhatsApp/telefone</label><input id="phone"></div><div><label>CPF/CNPJ</label><input id="document"></div></div><label>CEP de entrega</label><div class="grid"><div><input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000"></div><div><button class="btn" id="shippingBtn" type="button">Calcular frete</button></div></div><div class="muted">Origem do envio: CEP 05874-160</div><label>Endereço para entrega</label><textarea id="address" rows="4" placeholder="Rua, número, complemento, bairro, cidade, UF e CEP"></textarea></div><div class="card"><h2>Frete</h2><div id="shipping"><p class="muted">Informe seu CEP para calcular as opções de entrega.</p></div></div><div class="card"><h2>Resumo</h2><div id="summary"></div><div id="msg" class="msg"></div></div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script>const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),cart=JSON.parse(localStorage.getItem('araujo_cart')||'[]');let subtotal=cart.reduce((s,x)=>s+Number(x.price)*Number(x.quantity),0),shipping=0,shippingChoice=null;function render(){const el=$('summary');if(!cart.length){el.innerHTML='<p>Carrinho vazio. <a href="produtos.html">Voltar aos produtos</a></p>';return}el.innerHTML=cart.map(x=>`<p><strong>${x.quantity}x</strong> ${x.name} — ${money(x.price*x.quantity)}</p>`).join('')+`<hr><p>Subtotal: <strong>${money(subtotal)}</strong></p><p>Frete: <strong>${shippingChoice?money(shipping):'A calcular'}</strong></p><div class="total">Total: ${money(subtotal+(shippingChoice?shipping:0))}</div><br><button class="btn" id="pay">Continuar para PagBank</button>`;$('pay').onclick=checkout}render();$('cep').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v});$('shippingBtn').onclick=async()=>{const cep=$('cep').value.replace(/\D/g,'');if(cep.length!==8){$('shipping').innerHTML='<div class="err">Informe um CEP válido com 8 dígitos.</div>';return}shippingChoice=null;shipping=0;render();$('shipping').innerHTML='<p>Calculando frete...</p>';try{const r=await fetch('https://sjmalhhugkixboenycex.supabase.co/functions/v1/calculate-shipping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cep_destino:cep,products:cart.map(x=>({id:x.id,quantity:x.quantity,width:Number(x.width)||15,height:Number(x.height)||10,length:Number(x.length)||20,weight:Number(x.weight)||0.5,insurance_value:Number(x.price)||0}))})});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'Não foi possível calcular o frete');if(!d.options?.length)throw new Error('Nenhuma opção de frete foi encontrada para este CEP.');$('shipping').innerHTML=d.options.map((o,i)=>`<label class="shipping-option"><input type="radio" name="shipping" value="${i}"> <strong>${o.company?o.company+' — ':''}${o.name}</strong><br><span>${money(o.price)} · prazo estimado: ${o.delivery_time||'—'} dias</span></label>`).join('');document.querySelectorAll('input[name="shipping"]').forEach((r,i)=>r.onchange=()=>{shipping=Number(d.options[i].price);shippingChoice=d.options[i];render();document.querySelectorAll('input[name="shipping"]').forEach((z,j)=>z.checked=j===i)});if(d.options.length===1){document.querySelector('input[name="shipping"]').click()}}catch(e){$('shipping').innerHTML=`<div class="err">${String(e.message).replace(/</g,'&lt;')}</div>`}};async function checkout(){const name=$('name').value.trim(),email=$('email').value.trim(),cep=$('cep').value.replace(/\D/g,'');if(!name||!email){$('msg').className='msg err';$('msg').textContent='Informe nome e e-mail.';return}if(cep.length!==8||!shippingChoice){$('msg').className='msg err';$('msg').textContent='Calcule e selecione uma opção de frete antes de continuar.';return}const pay=$('pay');pay.disabled=true;$('msg').className='msg';$('msg').textContent='Criando pedido...';try{const r=await fetch('https://sjmalhhugkixboenycex.supabase.co/functions/v1/create-pagbank-checkout-public-v2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(x=>({id:x.id,quantity:x.quantity})),shipping:{cep_destino:cep,service_id:shippingChoice.id,service_name:shippingChoice.name,company:shippingChoice.company,price:shippingChoice.price,delivery_time:shippingChoice.delivery_time},customer:{name,email,phone:$('phone').value.trim(),document:$('document').value.trim(),address:$('address').value.trim()}})});const data=await r.json();if(!r.ok){const d=typeof data.details==='string'?data.details:JSON.stringify(data.details||{},null,2);throw new Error(`${data.error||'Não foi possível criar o pedido'}${data.http_status?` (HTTP ${data.http_status})`:''}\n${d}`)}if(data.checkout_url){location.href=data.checkout_url;return}$('msg').className='msg ok';$('msg').innerHTML=`Pedido <strong>${data.order_id}</strong> criado. ${data.message||'O checkout PagBank ainda não está configurado.'}`;pay.disabled=false}catch(e){$('msg').className='msg err';$('msg').innerHTML=`${String(e.message).replace(/</g,'&lt;').replace(/\n/g,'<br>')}<div class="details">Se o erro mencionar allowlist/403, a conta PagBank ainda precisa de liberação para produção.</div>`;pay.disabled=false}}</script></body></html>
