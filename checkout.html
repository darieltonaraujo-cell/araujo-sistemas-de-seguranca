<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(900px,92%);margin:auto;padding:45px 0}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:24px;margin:15px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8e4;border-radius:9px;margin:6px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.total{font-size:1.5rem;font-weight:800;text-align:right}.btn{background:#078cff;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:700;cursor:pointer}.msg{margin-top:15px}.ok{background:#edf9f1;padding:15px;border-radius:10px}.err{background:#fff1f1;color:#9a2222;padding:15px;border-radius:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a><a href="carrinho.html">🛒 Carrinho</a></nav></div></header><main class="wrap"><h1>Finalizar compra</h1><div class="card"><h2>Seus dados</h2><div class="grid"><div><label>Nome completo</label><input id="name" required></div><div><label>E-mail</label><input id="email" type="email" required></div><div><label>WhatsApp/telefone</label><input id="phone"></div><div><label>CPF/CNPJ</label><input id="document"></div></div><label>Endereço para entrega</label><textarea id="address" rows="4" placeholder="Rua, número, complemento, bairro, cidade, UF e CEP"></textarea></div><div class="card"><h2>Resumo</h2><div id="summary"></div><div id="msg" class="msg"></div></div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script>const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const cart=JSON.parse(localStorage.getItem('araujo_cart')||'[]');const total=cart.reduce((s,x)=>s+x.price*x.quantity,0);if(!cart.length){$('summary').innerHTML='<p>Carrinho vazio. <a href="produtos.html">Voltar aos produtos</a></p>'}else{$('summary').innerHTML=cart.map(x=>`<p><strong>${x.quantity}x</strong> ${x.name} — ${money(x.price*x.quantity)}</p>`).join('')+`<div class="total">Total: ${money(total)}</div><br><button class="btn" id="pay">Continuar para PagBank</button>`;$('pay').onclick=async()=>{const name=$('name').value.trim(),email=$('email').value.trim();if(!name||!email){$('msg').className='msg err';$('msg').textContent='Informe nome e e-mail.';return}$('pay').disabled=true;$('msg').className='msg';$('msg').textContent='Criando pedido...';try{const r=await fetch('https://sjmalhhugkixboenycex.supabase.co/functions/v1/create-pagbank-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(x=>({id:x.id,quantity:x.quantity})),customer:{name,email,phone:$('phone').value.trim(),document:$('document').value.trim(),address:$('address').value.trim()},origin:location.origin})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível criar o pedido');if(data.checkout_url){location.href=data.checkout_url;return}$('msg').className='msg ok';$('msg').innerHTML=`Pedido <strong>${data.order_id}</strong> criado. ${data.message||'O checkout PagBank ainda não está configurado.'}`;$('pay').disabled=false}catch(e){$('msg').className='msg err';$('msg').textContent=e.message;$('pay').disabled=false}}}</script></body></html>
