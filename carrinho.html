<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | Araújo Sistemas de Segurança</title><link rel="stylesheet" href="style.css"><style>.wrap{width:min(1000px,92%);margin:auto;padding:45px 0}.item{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:14px;margin:12px 0}.item img{width:90px;height:75px;object-fit:cover;border-radius:8px;background:#eef3f7}.qty{display:flex;gap:8px;align-items:center}.qty button,.remove,.checkout{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.qty button{background:#eaf1f7}.remove{background:#fff0f0;color:#a22}.summary{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:20px;margin-top:20px;text-align:right}.checkout{background:#078cff;color:white;font-weight:700}.empty{text-align:center;padding:50px;background:#fff;border:1px solid #dbe5ef;border-radius:14px}@media(max-width:650px){.item{grid-template-columns:70px 1fr}.item img{width:70px;height:60px}.qty{grid-column:2}}</style></head><body><header><div class="nav"><a href="index.html"><img src="logo.png" alt="Araújo Sistemas de Segurança"></a><nav><a href="index.html">Início</a><a href="produtos.html">Produtos e Serviços</a><a href="projetos.html">Projetos</a><a href="carrinho.html">🛒 Carrinho</a></nav></div></header><main class="wrap"><h1>Seu carrinho</h1><div id="list"></div><div id="summary"></div></main><footer><img src="logo.png" alt="Logo"> © 2026 Araújo Sistemas de Segurança • São Paulo/SP</footer><script>const $=id=>document.getElementById(id);const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function get(){return JSON.parse(localStorage.getItem('araujo_cart')||'[]')}function save(c){localStorage.setItem('araujo_cart',JSON.stringify(c))}function render(){const c=get();if(!c.length){$('list').innerHTML='<div class="empty">Seu carrinho está vazio.<br><br><a href="produtos.html">Ver produtos e serviços</a></div>';$('summary').innerHTML='';return}$('list').innerHTML=c.map((x,i)=>`<div class="item"><img src="${x.cover||'logo.png'}" alt=""><div><strong>${x.name}</strong><br><span>${money(x.price)}</span></div><div class="qty"><button data-a="minus" data-i="${i}">−</button><b>${x.quantity}</b><button data-a="plus" data-i="${i}">+</button><button class="remove" data-a="remove" data-i="${i}">Excluir</button></div></div>`).join('');const total=c.reduce((s,x)=>s+x.price*x.quantity,0);$('summary').innerHTML=`<h2>Total: ${money(total)}</h2><button class="checkout" onclick="location.href='checkout.html'">Continuar para checkout</button>`;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const c=get(),i=Number(b.dataset.i),a=b.dataset.a;if(a==='plus')c[i].quantity++;if(a==='minus')c[i].quantity--;if(a==='remove'||c[i].quantity<=0)c.splice(i,1);save(c);render()})}render();</script></body></html>
