<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | Painel Araújo</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#102033}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:18px;margin-top:18px;overflow:auto}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf3;vertical-align:top}select,.btn{padding:9px;border-radius:8px;border:1px solid #cbd8e5;background:#fff;font-weight:700}.btn{cursor:pointer}.primary{background:#078cff;color:#fff;border-color:#078cff}.status{font-weight:700}.msg{margin-top:12px}.error{color:#a11}.empty{text-align:center;padding:30px;color:#60758a}.modal{display:none;position:fixed;inset:0;background:#10203399;z-index:5;padding:20px;overflow:auto}.modalbox{max-width:850px;margin:3vh auto;background:#fff;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.line{padding:8px 0;border-bottom:1px solid #e6edf3}.total{font-size:1.25rem;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px}th,td{white-space:normal}} </style></head><body><div class="wrap"><div class="top"><div><small>ÁREA ADMINISTRATIVA</small><h1>📦 Pedidos</h1><div>Gerenciamento completo de vendas, frete e pagamentos</div></div><div><button class="btn" onclick="location.href='admin-dashboard.html'">← Painel</button></div></div><div class="card"><div class="toolbar"><div><label>Status: <select id="filter"><option value="">Todos</option><option value="pending">Pendente</option><option value="paid">Pago</option><option value="processing">Em preparação</option><option value="shipped">Enviado</option><option value="completed">Entregue</option><option value="failed">Falhou</option><option value="cancelled">Cancelado</option><option value="refunded">Reembolsado</option></select></label></div><button class="btn" id="reload">Atualizar</button></div><div id="msg" class="msg"></div><div id="table" class="empty">Carregando...</div></div></div><div id="modal" class="modal"><div class="modalbox"><div class="toolbar"><h2>Detalhes do pedido</h2><button class="btn" id="close">Fechar</button></div><div id="detail"></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const labels={pending:'Pendente',paid:'Pago',processing:'Em preparação',shipped:'Enviado',completed:'Entregue',failed:'Falhou',cancelled:'Cancelado',refunded:'Reembolsado'};let orders=[];async function guard(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='admin.html';return false}return true}async function load(){if(!await guard())return;let q=sb.from('orders').select('*').order('created_at',{ascending:false});const f=$('filter').value;if(f)q=q.eq('status',f);const{data,error}=await q;if(error){$('table').innerHTML='<div class="error">'+esc(error.message)+'</div>';return}orders=data||[];if(!orders.length){$('table').innerHTML='<div class="empty">Nenhum pedido encontrado.</div>';return}$('table').innerHTML='<table><thead><tr><th>Data</th><th>Cliente</th><th>Entrega/Frete</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody>'+orders.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR')}</td><td><strong>${esc(o.customer_name)}</strong><br><small>${esc(o.customer_email||'')}<br>${esc(o.customer_phone||'')}<br>${esc(o.customer_document||'')}</small></td><td>${esc(o.shipping_address?.cep||o.shipping_address?.cep_destino||'CEP não informado')}<br><small>${esc(o.shipping_company||o.shipping_provider||'')} ${esc(o.shipping_service||o.shipping_service_name||'')}<br>${money(o.shipping||o.shipping_cost||0)}</small></td><td><strong>${money(o.total)}</strong><br><small>Produtos: ${money(o.subtotal)}</small></td><td><select data-status="${o.id}">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><button class="btn primary" data-detail="${o.id}">Ver pedido</button></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>setStatus(s.dataset.status,s.value));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail))}async function setStatus(id,status){const{error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){$('msg').textContent='Não foi possível alterar: '+error.message;load();return}$('msg').textContent='Status atualizado.'}async function detail(id){const o=orders.find(x=>x.id===id);if(!o)return;const{data:items,error}=await sb.from('order_items').select('*').eq('order_id',id).order('created_at');if(error){$('detail').innerHTML='<p class="error">'+esc(error.message)+'</p>'}else{$('detail').innerHTML=`<div class="grid"><div><h3>Cliente</h3><div class="line"><b>Nome:</b> ${esc(o.customer_name)}</div><div class="line"><b>E-mail:</b> ${esc(o.customer_email)}</div><div class="line"><b>Telefone:</b> ${esc(o.customer_phone||'-')}</div><div class="line"><b>CPF/CNPJ:</b> ${esc(o.customer_document||'-')}</div></div><div><h3>Entrega</h3><div class="line"><b>Endereço:</b> ${esc(o.shipping_address?.full_address||o.shipping_address?.address||'-')}</div><div class="line"><b>CEP:</b> ${esc(o.shipping_address?.cep||o.shipping_address?.cep_destino||'-')}</div><div class="line"><b>Frete:</b> ${money(o.shipping)}</div><div class="line"><b>Transportadora:</b> ${esc(o.shipping_company||o.shipping_provider||'-')} ${esc(o.shipping_service||o.shipping_service_name||'')}</div></div></div><h3>Itens</h3>${(items||[]).map(i=>`<div class="line">${esc(i.product_name)} — ${i.quantity} × ${money(i.unit_price)} = <b>${money(i.total)}</b></div>`).join('')||'<p>Nenhum item.</p>'}<div class="line">Subtotal: ${money(o.subtotal)}</div><div class="line">Frete: ${money(o.shipping)}</div><div class="line total">Total: ${money(o.total)}</div><div class="line">Pagamento: ${esc(o.payment_method||'-')} • ${esc(o.provider||'-')}</div><div class="line">ID do pedido: <small>${esc(o.id)}</small></div><div class="line">ID PagBank: <small>${esc(o.provider_order_id||'-')}</small></div>`}$('modal').style.display='block'}$('close').onclick=()=>$('modal').style.display='none';$('filter').onchange=load;$('reload').onclick=load;load();</script></body></html>
