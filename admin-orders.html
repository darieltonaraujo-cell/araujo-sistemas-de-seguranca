<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | Painel Araújo</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#102033}.wrap{max-width:1150px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #dbe5ef;border-radius:16px;padding:18px;margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6edf3;white-space:nowrap}select{padding:9px;border-radius:8px;border:1px solid #cbd8e5}.status{font-weight:700}.msg{margin-top:12px}.error{color:#a11}.empty{text-align:center;padding:30px;color:#60758a}</style></head><body><div class="wrap"><div class="top"><div><h1>📦 Pedidos</h1><div>Gerenciamento de vendas e pagamentos</div></div><a href="admin-dashboard.html">← Painel</a></div><div class="card"><label>Status: <select id="filter"><option value="">Todos</option><option>pending</option><option>paid</option><option>processing</option><option>shipped</option><option>completed</option><option>failed</option><option>cancelled</option><option>refunded</option></select></label><div id="msg" class="msg"></div><div id="table" class="empty">Carregando...</div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://sjmalhhugkixboenycex.supabase.co','sb_publishable_oXjtaNLw5daX7aaPR4H-4A_D-9R8Rtg');const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const{data:{user}}=await sb.auth.getUser();if(!user){$('table').innerHTML='<div class="error">Faça login no painel administrativo.</div>';return}let q=sb.from('orders').select('id,customer_name,customer_email,customer_phone,total,payment_method,status,provider,provider_order_id,created_at').order('created_at',{ascending:false});const f=$('filter').value;if(f)q=q.eq('status',f);const{data,error}=await q;if(error){$('table').innerHTML=`<div class="error">${esc(error.message)}</div>`;return}if(!data?.length){$('table').innerHTML='<div class="empty">Nenhum pedido encontrado.</div>';return}$('table').innerHTML='<table><thead><tr><th>Data</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Status</th><th>ID</th></tr></thead><tbody>'+data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR')}</td><td><strong>${esc(o.customer_name)}</strong><br><small>${esc(o.customer_email||'')}</small></td><td>${money(o.total)}</td><td>${esc(o.payment_method||o.provider||'')}</td><td><span class="status">${esc(o.status)}</span></td><td><small>${esc(o.id)}</small></td></tr>`).join('')+'</tbody></table>'}$('filter').onchange=load;load();</script></body></html>
